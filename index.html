<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Find Your Best Running Window | AERO RUN</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "on-surface-variant": "#45464d",
                "tertiary": "#000000",
                "outline-variant": "#c6c6cd",
                "primary-fixed": "#dae2fd",
                "inverse-primary": "#bec6e0",
                "surface": "#f7f9fb",
                "primary-container": "#131b2e",
                "secondary-fixed": "#6ffbbe",
                "surface-bright": "#f7f9fb",
                "on-primary-fixed-variant": "#3f465c",
                "surface-glass": "rgba(255, 255, 255, 0.8)",
                "tertiary-container": "#0b1c30",
                "vibrant-mint": "#2DD4BF",
                "on-surface": "#191c1e",
                "error": "#ba1a1a",
                "on-secondary-fixed-variant": "#005236",
                "on-tertiary-fixed": "#0b1c30",
                "inverse-on-surface": "#eff1f3",
                "surface-container-lowest": "#ffffff",
                "on-tertiary": "#ffffff",
                "on-primary": "#ffffff",
                "inverse-surface": "#2d3133",
                "surface-container": "#eceef0",
                "on-secondary-container": "#00714d",
                "on-tertiary-fixed-variant": "#38485d",
                "surface-container-highest": "#e0e3e5",
                "primary-fixed-dim": "#bec6e0",
                "surface-container-high": "#e6e8ea",
                "error-container": "#ffdad6",
                "surface-variant": "#e0e3e5",
                "secondary-fixed-dim": "#4edea3",
                "surface-dim": "#d8dadc",
                "surface-container-low": "#f2f4f6",
                "primary": "#000000",
                "on-tertiary-container": "#75859d",
                "on-error-container": "#93000a",
                "on-background": "#191c1e",
                "secondary-container": "#6cf8bb",
                "midnight-deep": "#020617",
                "surface-tint": "#565e74",
                "cool-gray-100": "#F1F5F9",
                "tertiary-fixed-dim": "#b7c8e1",
                "on-secondary-fixed": "#002113",
                "secondary": "#006c49",
                "on-primary-container": "#7c839b",
                "on-secondary": "#ffffff",
                "background": "#f7f9fb",
                "tertiary-fixed": "#d3e4fe",
                "on-primary-fixed": "#131b2e",
                "on-error": "#ffffff",
                "cool-gray-900": "#1E293B",
                "outline": "#76777d"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "gutter": "24px",
                "margin-desktop": "48px",
                "stack-lg": "40px",
                "stack-md": "24px",
                "margin-mobile": "16px",
                "stack-sm": "12px",
                "container-max": "1200px",
                "base": "8px"
        },
        "fontFamily": {
                "headline-md": ["Montserrat"],
                "headline-lg": ["Montserrat"],
                "label-bold": ["Inter"],
                "body-lg": ["Inter"],
                "label-sm": ["Inter"],
                "headline-lg-mobile": ["Montserrat"],
                "display-lg": ["Montserrat"],

        "fontSize": {

                "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                "label-bold": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],

<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-surface text-on-surface min-h-screen font-body-md flex flex-col relative pb-24">
<!-- TopAppBar -->
<header class="bg-surface-glass backdrop-blur-md shadow-sm fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 transition-all duration-200 ease-in-out">
  <div class="flex items-center gap-2">
    <span class="material-symbols-outlined text-vibrant-mint" style="font-variation-settings: 'FILL' 1;">diamond</span>
    <h1 class="font-headline-md text-headline-md tracking-tighter text-primary">AERO RUN</h1>
  </div>
  <nav class="hidden md:flex gap-6">
    <a class="font-label-bold text-label-bold text-primary border-b-2 border-vibrant-mint pb-1" href="#">Forecast</a>
    <a class="font-label-bold text-label-bold text-on-surface-variant hover:opacity-80 transition-opacity" href="#">Routes</a>
    <a class="font-label-bold text-label-bold text-on-surface-variant hover:opacity-80 transition-opacity" href="#">Activity</a>
  </nav>
</header>

<main class="flex-grow pt-16 md:pt-24 flex flex-col items-center">
  <!-- Hero Section -->
  <section class="w-full relative h-[55vh] min-h-[420px] flex items-end pb-stack-lg px-margin-mobile md:px-margin-desktop overflow-hidden">
    <picture class="absolute inset-0 z-0">
      <source srcset="assets/banner.webp" type="image/webp">
      <img src="assets/banner.jpg" alt="Trail runner at sunrise in the alpine mountains" class="w-full h-full object-cover" style="object-position: center 35%;">
    </picture>
    <div class="absolute inset-0 hero-gradient z-[1]"></div>
    <div class="relative z-10 w-full max-w-container-max mx-auto text-on-primary">
      <h2 class="font-display-lg text-display-lg mb-stack-sm md:w-2/3 lg:w-1/2 leading-tight drop-shadow-[0_2px_8px_rgba(0,0,0,0.6)]">Find Your Best Running Window</h2>
      <p class="font-body-lg text-body-lg text-white md:w-1/2 opacity-95 drop-shadow-[0_1px_4px_rgba(0,0,0,0.7)]">The coolest, lowest-heat-stress minutes of your day — to the nearest minute.</p>
    </div>
  </section>

  <!-- Form Card -->
  <section class="w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop -mt-12 relative z-20 mb-stack-lg">
    <div class="glass-card rounded-xl border border-cool-gray-100 p-margin-mobile md:p-stack-lg shadow-[0_20px_40px_-15px_rgba(2,6,23,0.1)]">
      <form id="form" class="space-y-stack-md">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
          <!-- ZIP Code -->
          <div class="flex flex-col space-y-base">
            <label class="font-label-bold text-label-bold text-on-surface uppercase" for="zipcode">ZIP code</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline field-icon" style="font-variation-settings: 'FILL' 0;">location_on</span>
              <input class="w-full bg-cool-gray-100 border-none rounded-lg py-3 pl-10 pr-4 text-body-md focus:ring-2 focus:ring-vibrant-mint focus:bg-surface-container-lowest transition-all duration-200" id="zipcode" inputmode="numeric" name="zipcode" pattern="[0-9]{5}" placeholder="Enter ZIP" type="text" required>
            </div>
          </div>
          <!-- Date -->
          <div class="flex flex-col space-y-base">
            <label class="font-label-bold text-label-bold text-on-surface uppercase" for="date">Date</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline field-icon" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
              <input class="w-full bg-cool-gray-100 border-none rounded-lg py-3 pl-10 pr-4 text-body-md focus:ring-2 focus:ring-vibrant-mint focus:bg-surface-container-lowest transition-all duration-200 text-on-surface" id="date" name="date" type="date" value="2026-08-21" required>
            </div>
          </div>
        </div>
        <!-- Run Length -->
        <div class="flex flex-col space-y-base md:w-1/2">
          <label class="font-label-bold text-label-bold text-on-surface uppercase" for="duration">Run length (minutes)</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline field-icon" style="font-variation-settings: 'FILL' 0;">timer</span>
            <input class="w-full bg-cool-gray-100 border-none rounded-lg py-3 pl-10 pr-4 text-body-md focus:ring-2 focus:ring-vibrant-mint focus:bg-surface-container-lowest transition-all duration-200" id="duration" name="duration" placeholder="e.g. 45" type="number" min="1" max="600" value="45" required>
          </div>
        </div>
        <!-- Shaded Route Toggle -->
        <div class="flex items-center justify-between py-stack-md border-t border-surface-variant mt-stack-md">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-vibrant-mint" style="font-variation-settings: 'FILL' 0;">park</span>
            <div>
              <span class="font-label-bold text-label-bold text-on-surface block">Shaded route</span>
              <span class="font-label-sm text-label-sm text-on-surface-variant">Prioritize paths with no direct sun</span>
            </div>
          </div>
          <div class="relative inline-block w-12 h-6 mr-2 shrink-0">
            <input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-surface-variant focus:ring-0 focus:outline-none transition-all duration-200 z-10" id="toggle" name="toggle" type="checkbox">
            <label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200" for="toggle"></label>
          </div>
        </div>
        <!-- CTA -->
        <div class="pt-stack-md mt-stack-md md:border-t border-surface-variant">
          <button class="w-full md:w-auto px-8 py-4 bg-midnight-deep text-vibrant-mint font-label-bold text-label-bold rounded-lg hover:shadow-lg hover:scale-[1.02] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">search</span>
            Find my best run window
          </button>
          <p id="error" class="error" role="alert" hidden></p>
        </div>
      </form>
    </div>
  </section>

  <!-- Results -->
  <section id="results" class="results w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop mb-stack-lg" aria-live="polite"></section>

  <!-- Chart -->
  <section id="chart" class="chart-card glass-card rounded-xl border border-cool-gray-100 p-margin-mobile md:p-stack-lg shadow-[0_20px_40px_-15px_rgba(2,6,23,0.1)] w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop mb-stack-lg" aria-label="24-hour weather timeline"></section>
</main>

<script>
  // Micro-interaction: mint icon on input focus
  const inputs = document.querySelectorAll('input:not([type="checkbox"])');
  inputs.forEach(input => {
    input.addEventListener('focus', () => {
      const icon = input.parentElement.querySelector('.field-icon');
      if (icon) { icon.classList.add('text-vibrant-mint'); icon.classList.remove('text-outline'); }
    });
    input.addEventListener('blur', () => {
      const icon = input.parentElement.querySelector('.field-icon');
      if (icon) { icon.classList.remove('text-vibrant-mint'); icon.classList.add('text-outline'); }
    });
  });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
